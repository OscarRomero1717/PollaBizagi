<div class="table-wrap table-wrap--responsive">
  <table class="leaderboard-table responsive-table">
    <thead>
      <tr>
        <th>#</th>
        <th>Participante</th>
        <th>Puntos</th>
        <th>Exactos</th>
      </tr>
    </thead>
    <tbody>
      @for (entry of entries; track entry.rank) {
        <tr [class.is-current]="isCurrentUser(entry)">
          <td data-label="#">{{ entry.rank }}</td>
          <td data-label="Participante">{{ entry.displayName }}</td>
          <td data-label="Puntos">{{ entry.totalPoints }}</td>
          <td data-label="Exactos">{{ entry.exactHits }}</td>
        </tr>
      }
    </tbody>
  </table>
</div>
