@if (!canPredict) {
  <p class="hint">
    @if (match.status !== MatchStatus.Open) {
      La ventana de predicción está cerrada para este partido.
    } @else {
      Solo usuarios con rol User pueden registrar predicciones.
    }
  </p>
} @else {
  @if (errorMessage) {
    <p class="form-error">{{ errorMessage }}</p>
  }

  <form class="prediction-form" [formGroup]="form" (ngSubmit)="submit()">
    <label>
      Local
      <input type="number" min="0" formControlName="homeGoals" />
    </label>
    <span class="separator">-</span>
    <label>
      Visitante
      <input type="number" min="0" formControlName="awayGoals" />
    </label>
    <button type="submit" [disabled]="submitting">
      {{ submitting ? 'Guardando...' : (isEditMode ? 'Actualizar' : 'Predecir') }}
    </button>
  </form>
}
